[project]
name = "typesafe-monitor"
version = "0.1.0"
description = "A minimal TypeSafe AI monitor for software-change evidence"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.6"]

[tool.pytest.ini_options]
testpaths = ["test_monitor.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
unsafe-fixes = false
extend-exclude = ["private-runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "PLR0915"]
unfixable = ["F401", "F841", "B"]

[tool.ruff.lint.pylint]
max-statements = 50
